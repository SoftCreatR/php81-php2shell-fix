name: Build and verify PHP2Shell-fixed PHP 8.1
on:
  push:
    branches: [main]
    tags: ['8.1.34-php2shell.*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build and FPM test tools
        run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake bison re2c flex cmake libfcgi-bin pkg-config git curl
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/linux/downloads
          key: php2shell-spc-2.8.5-downloads-${{ runner.os }}-${{ hashFiles('scripts/build-linux.sh') }}
          restore-keys: php2shell-spc-2.8.5-downloads-${{ runner.os }}-
      - name: Build and test standalone CLI, CGI and FPM
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/build-linux.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x86_64
          path: dist/*
          if-no-files-found: error
      - name: Preserve failed Linux build for diagnosis
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-failure-diagnostics
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: ignore
          path: |
            .build/linux/buildroot/bin/php
            .build/linux/buildroot/bin/php-cgi
            .build/linux/buildroot/bin/php-fpm
            .build/linux/source/php-src/main/php_version.h
            .build/linux/source/php-src/configure.ac
            .build/linux/source/php-src/Makefile
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and test x64 NTS PHP with the VS2019 toolset
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-nts
          path: dist/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*
      - name: Publish tested binaries and exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "PHP $GITHUB_REF_NAME — PHP2Shell backport" --notes-file docs/RELEASE.md
